services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: taskflow-backend

    env_file:
      - ./backend/.env

    environment:
      PORT: 3000

    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: taskflow-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend